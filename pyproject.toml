[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrion-bt-player"
version = "1.0.0"
description = "Lokaler headless Lyrion Bluetooth Player"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "dbus-next==0.2.3", "httpx>=0.27,<1", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
lyrion-bt = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/assets/*", "static/favicon/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
