name: Verify player and installer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test]'
      - run: python -m compileall -q app deploy scripts
      - run: python -m pytest -q
      - run: find . -path './.git' -prune -o -name '*.sh' -print0 | xargs -0 -n1 bash -n
